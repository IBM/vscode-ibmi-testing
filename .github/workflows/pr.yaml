name: Build Extension & CLI

on:
  workflow_dispatch:

  pull_request:

jobs:
  api-run-test-with-coverage:
    name: Run API Tests with Coverage

    runs-on: ubuntu-latest

    environment: COMMON1

    strategy:
      matrix:
        node-version: [20.x]
        include:
          - branch: main
            artifact: main
          - branch: ${{ github.head_ref }}
            artifact: pull-request

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install API Dependencies
        working-directory: api
        run:  npm install

      - name: Run API Tests with Coverage
        working-directory: api
        run: npm run coverage
        env:
          VITE_IBMI_HOST: ${{ secrets.IBMI_HOST }}
          VITE_IBMI_USER: ${{ secrets.IBMI_USER }}
          VITE_IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
          VITE_IBMI_SSH_PORT: ${{ secrets.IBMI_SSH_PORT }}

      - name: Copy Thresholds Config
        working-directory: api
        run: cp vitest.thresholds.js coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.artifact }}
          path: api/coverage/
  api-report-coverage:
    name: Report API Test Coverage

    needs: api-run-test-with-coverage

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download PR Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-pull-request
          path: pr-coverage

      - name: Download main Coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-main
          path: main-coverage

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: pr-coverage/coverage-summary.json
          json-summary-compare-path: main-coverage/coverage-summary.json
          json-final-path: pr-coverage/coverage-final.json
          vite-config-path: pr-coverage/vitest.thresholds.js
          comment-on: pr
  build-extension:
    name: Build Extension

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g vsce
          cd cli
          npm install

      - name: Build Extension
        run: |
          vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-ibmi-testing-pr-build
          path: ./*.vsix
          if-no-files-found: error
  build-cli:
    name: Build CLI

    runs-on: ubuntu-latest

    environment: COMMON1

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install CLI Dependencies
        working-directory: cli
        run: |
          npm run install:api
          npm install

      - name: Build CLI
        working-directory: cli
        run: |
          npm run webpack
          npm publish --dry-run
    
      - name: Install CLI Tools
        run: npm i -g @ibm/ibmi-ci
        
      - name: Build Sample Project
        working-directory: examples/ibmi-company_system
        run: |
          ici \
            --cmd "mkdir -p './builds/itest_${GITHUB_HEAD_REF}'" \
            --rcwd "./builds/itest_${GITHUB_HEAD_REF}" \
            --push "." \
            --ignore --cl "CRTLIB ITESTPR" \
            --ignore --cl "CLRLIB ITESTPR" \
            --cmd "/QOpenSys/pkgs/bin/gmake BIN_LIB=ITESTPR"
        env:
          IBMI_HOST: ${{ secrets.IBMI_HOST }}
          IBMI_USER: ${{ secrets.IBMI_USER }}
          IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
          IBMI_SSH_PORT: ${{ secrets.IBMI_SSH_PORT }}

      - name: Test CLI
        working-directory: cli
        run: |
          chmod +x ./dist/index.js
          ./dist/index.js \
          --ld ../examples/ibmi-company_system \
          --id /home/SANJULA/builds/ibmi-company_system \
          --ll ITESTPR RPGUNIT QDEVTOOLS \
          --cl ITESTPR \
          --cc --sr --tr --to --co
        env:
          IBMI_HOST: ${{ secrets.IBMI_HOST }}
          IBMI_USER: ${{ secrets.IBMI_USER }}
          IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
          IBMI_SSH_PORT: ${{ secrets.IBMI_SSH_PORT }}